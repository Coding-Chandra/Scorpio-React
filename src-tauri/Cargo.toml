[package]
name = "notoz"
version = "2.4.5700"
description = "Notoz Android Native"
authors = ["Notoz Team"]
edition = "2021"

[lib]
name = "notoz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
base64 = "0.22"

[profile.dev]
opt-level = 1
debug = 0
strip = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
