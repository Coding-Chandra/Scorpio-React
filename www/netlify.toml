[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "no-cache"

[build]
  functions = ".netlify/functions"
  publish = "."

[dev]
  functions = "functions"
  publish = "."

# Block direct web access to Android, Capacitor, and internal script files
[[redirects]]
  from = "/android/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/app/index.html"
  status = 200
  force = false
  conditions = { "Path" = [ "!/app/js/*" ] }  # Exclude functions

[[plugins]]
package = "@netlify/plugin-functions-install-core"
