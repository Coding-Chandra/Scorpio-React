<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, interactive-widget=resizes-content">
  <title>Notoz</title>
  <script>
    (function () {
      const root = document.documentElement;
      const ui = localStorage.getItem("ui-theme") || "ios";
      root.setAttribute("data-ui", ui);
      const mode = localStorage.getItem("notesApp_theme");
      if (mode) {
        root.setAttribute("data-theme", mode);
      }
      if (ui === "md3e") {
        const hex = localStorage.getItem("md3e-seed");
        if (hex) {
          const v = hex.replace("#", "");
          root.style.setProperty("--md-seed", `${parseInt(v.slice(0, 2), 16)},${parseInt(v.slice(2, 4), 16)},${parseInt(v.slice(4, 6), 16)}`);
        }
      }

      const wallpaper = localStorage.getItem('notesApp_wallpaper') || 'w1';
      const wallpaperMap = {
        'w1': "url('https://res.cloudinary.com/dpemqdflm/image/upload/v1777916043/photo-gallery/nishantc205_gmail_com/the-electric-vein-1777916038428.jpg')",
        'w2': "url('https://res.cloudinary.com/dpemqdflm/image/upload/v1777554449/photo-gallery/nishantc205_gmail_com/the-golden-ascent-1777554445493.jpg')",
        'w3': "url('https://res.cloudinary.com/dpemqdflm/image/upload/v1777549757/photo-gallery/nishantc205_gmail_com/transient-flight-1777549752102.jpg')",
        'w4': "url('./src/assets/wallpapers/wallpaper-ios-md3e-4.jpg')",
        'n1': "url('./src/assets/wallpapers/wallpaper-nothing-os-1.jpg')",
        'n2': "url('./src/assets/wallpapers/wallpaper-nothing-os-2.jpg')",
        'n3': "url('./src/assets/wallpapers/wallpaper-nothing-os-3.jpg')",
        'n4': "url('./src/assets/wallpapers/wallpaper-nothing-os-4.jpg')"
      };
      const wallpaperValue = wallpaperMap[wallpaper] || (wallpaper.startsWith('http://') || wallpaper.startsWith('https://') ? `url('${wallpaper}')` : 'none');
      root.style.setProperty('--wallpaper-image', wallpaperValue);
    })();
  </script>
  <link rel="icon" type="image/png" href="./src/assets/icons/logo.png">
  <link rel="apple-touch-icon" href="./src/assets/icons/logo.png">
  <link rel="stylesheet" href="./src/css/animations.css">
  <link rel="stylesheet" href="./src/css/ui-enhancements.css">
  <link rel="stylesheet" href="./src/css/app.css">
  <link rel="stylesheet" href="./src/css/md3e-app.css" loading="lazy">
  <link rel="stylesheet" href="./src/css/nthng.css" loading="lazy">
  <link rel="manifest" href="../manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.6/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    (function () {
      function setVh() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', vh + 'px');
      }
      setVh();
      window.addEventListener('resize', setVh);
      window.addEventListener('orientationchange', setVh);
    })();
  </script>
</head>

<body>

  <div id="mobileNavBar"></div>

  <div id="app">
    <aside id="sidebar" class="pane glass-panel">
      <div class="sidebar-header">
        <div class="sidebar-header-actions">
          <button id="accountBtn" class="account-btn" onclick="app.toggleAccountDropdown(event)" title="Account">
            <div class="account-avatar-pill">
              <span id="accountAvatarInitials">U</span>
            </div>
          </button>
        </div>
        <br>
        <h2>Folders</h2>
      </div>
      <div class="folder-list" id="folderListContainer"></div>
      <div id="notesCountDisplay" class="notes-count-label">0 Notes</div>
      <div class="sidebar-actions">
        <button class="new-folder-btn" onclick="app.createNewFolder()">

            <path d="M3.5 7.5h5.3c.5 0 .9.2 1.2.5l1 1c.3.3.7.5 1.2.5h7.3c.8 0 1.5.7 1.5 1.5v7.5c0 1.1-.9 2-2 2H4.5c-1.1 0-2-.9-2-2V9.5c0-1.1.9-2 2-2z"></path>

            <path d="M12 14.5h6M15 11.5v6"></path>

        </button>

    <section id="notes-list-pane" class="pane glass-panel" user-select="none">
      <div class="list-header">
        <input type="text" id="searchInput" class="search-bar" placeholder=" 🔍︎ Search"
          oninput="app.handleSearch(this.value)">
      </div>
      <div class="notes-header-row">
        <span id="activeFolderName" style="font-weight:700; font-size:20px;">All Notes</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <button id="editNotesBtn" class="edit-notes-btn" onclick="app.toggleMultiSelect()">Edit</button>
          <button class="icon-btn new-note-btn" onclick="app.createNewNote()" title="New Note">

              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
            </svg>
          </button>
        </div>
      </div>
      <div class="notes-scroll-area" id="notesListContainer"></div>

      <div id="multiSelectBar" class="multi-select-bar">
        <span id="selectedCountLabel" class="multi-select-label">0 Selected</span>
        <button class="multi-select-delete-btn" onclick="app.deleteSelectedNotes()">Delete</button>
      </div>
    </section>

    <main id="editor-pane" class="pane glass-panel-strong">

      <div id="editorContainer" class="editor-container">
        <div class="editor-meta-info" id="editorDateDisplay"></div>

        <div class="toolbar">

          </button>
          <button onclick="document.execCommand('insertUnorderedList',false,null)" title="Bullet List"> • </button>
          <button onclick="document.execCommand('insertOrderedList',false,null)" title="Numbered List">1.</button>
          

          <button onclick="app.insertCheckbox()" title="Insert Checklist">

              <path d="M3 6.5l1.5 1.5 3-3" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"

              <path d="M10 6H22" stroke="#666" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="5" cy="16" r="3.5" stroke="#666" fill="none" stroke-linecap="round" stroke-linejoin="round" />

            </svg>
          </button>

          <button onclick="app.triggerImageUpload()" title="Insert Photo / Scan">

        </div>

        <div class="editor-inputs" id="editorInputArea">
          <input type="text" id="noteTitleInput" class="note-title-input" placeholder="Title"
            oninput="app.updateCurrentNote()">
          <input type="file" id="imgUpload" accept="image/*" style="display:none" onchange="app.handleImageFile(this)"
            capture="environment">
          <div id="noteContentInput" class="note-content-editable" contenteditable="true"
            oninput="app.updateCurrentNote()"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="selectionToolbar" class="selection-toolbar">
    <button type="button" onclick="selectionCommand('bold')" title="Bold"><b>B</b></button>
    <button type="button" onclick="selectionCommand('italic')" title="Italic"><i>I</i></button>
    <button type="button" onclick="selectionCommand('underline')" title="Underline"><u>U</u></button>
    <button type="button" onclick="selectionCommand('strikeThrough')" title="Strikethrough"><span
        style="text-decoration:line-through;">S</span></button>
    <button type="button" onclick="selectionCopy()">Copy</button>
    <button type="button" onclick="selectionPaste()">Paste</button>
    <button type="button" onclick="toggleHighlight()" title="Highlight">

    <div class="selection-toolbar-divider"></div>

      <button type="button" onclick="setSelectionColor('#ff3b30')" title="Red">
        <span class="color-dot" style="background:#ff3b30;"></span>
      </button>

        <span class="color-dot" style="background:#8e8e93;"></span>
      </button>
    </div>
  </div>

  <!-- Account dropdown (user info + theme + sign out + settings) -->

    <div class="account-dropdown-inner">
      <div class="account-dropdown-header">
        <div class="account-header-main">

          <div class="account-text">

    </div>
  </div>

  <div id="shareDropdown" class="dropdown-menu" role="dialog" aria-hidden="true">
    <div class="row">
      <button class="btn" onclick="app.shareCopy()">Copy</button>
      <button class="btn" onclick="app.systemShare()">Share</button>
      <button class="btn" onclick="app.exportTXT()">Export TXT</button>
      <button class="btn" onclick="app.exportPDF()">Export PDF</button>
    </div>
  </div>

  <div id="noteActionsMenu" class="dropdown-menu" role="menu" aria-hidden="true">
    <div class="row">
      <button class="btn" onclick="app.requestDeleteActiveNoteFromMenu()">Delete Note</button>
      <button class="btn" id="pinBtn" onclick="app.togglePin()" title="Pin/Unpin">Pin/Unpin
        <svg viewBox="0 0 24 24" style="transform:rotate(45deg);">
          <line x1="12" y1="17" x2="12" y2="22" />
          <path
            d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z" />
        </svg>
      </button>
    </div>
  </div>

  <div id="folderActionsMenu" class="dropdown-menu" role="menu" aria-hidden="true">
    <div class="row">
      <button class="btn" onclick="app.promptRenamePendingFolder()">Rename Folder</button>
      <button class="btn" onclick="app.requestDeletePendingFolder()">Delete Folder</button>
    </div>
  </div>

  <div id="appDialogOverlay" class="dialog-overlay">
    <div class="dialog-panel">
      <div id="dialogTitle" class="dialog-title"></div>
      <div id="dialogMessage" class="dialog-message" style="display:none;"></div>
      <input id="dialogInput" class="dialog-input" style="display:none;" />
      <div class="dialog-actions">
        <button id="dialogCancelBtn" class="dialog-btn dialog-btn-cancel" type="button">Cancel</button>
        <button id="dialogConfirmBtn" class="dialog-btn dialog-btn-confirm" type="button">OK</button>
      </div>
    </div>
  </div>

<!-- Your other scripts -->
  <script src="./src/js/animation-utils.js"></script>
  <script src="./src/js/offline-sync.js"></script>
  <script src="./src/js/app.js"></script>
  <script src="./src/js/md3e-enhance.js" defer loading="lazy"></script>
  <script>
    window.addEventListener("message", (e) => {
      if (!e.data || e.data.type !== "SET_MD3E_COLOR") return;

      const hex = e.data.color;
      if (!hex) return;

      const v = hex.replace("#", "");
      document.documentElement.style.setProperty(
        "--md-seed",
        `${parseInt(v.slice(0, 2), 16)},${parseInt(v.slice(2, 4), 16)},${parseInt(v.slice(4, 6), 16)}`
      );
    });
  </script>

</body>
