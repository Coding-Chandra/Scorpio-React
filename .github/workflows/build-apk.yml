name: Build Rust Native Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-rust-android:
    name: Assemble Rust Native Android APK
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "27.0.11902837"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Android NDK
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}" || true
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Setup Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Assets (Staging)
        run: node scripts/copy-web.js

      - name: Initialize Tauri Android Scaffolding
        run: npx @tauri-apps/cli android init --ci --skip-targets-install

      - name: Build Rust Native Android APK
        run: |
          BUILD_FLAG="--debug"
          if [ "${{ github.event.inputs.build_mode }}" = "release" ]; then
            BUILD_FLAG=""
          fi
          npx @tauri-apps/cli android build --apk $BUILD_FLAG --ci
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notoz-rust-native-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
